ze="14" fill="#64748B" font-weight="bold" text-anchor="middle">Imagen</text><rect x="250" y="280" width="140" height="110" rx="2" fill="none" stroke="#B42318" stroke-width="3" stroke-dasharray="8 5"/><text x="255" y="275" font-family="Arial" font-size="13" fill="#B42318" font-weight="bold" text-anchor="start">ROI</text><text x="60" y="565" font-family="Arial" font-size="13" fill="#64748B" font-weight="bold" text-anchor="start">Clase sugerida</text><text x="60" y="595" font-family="Arial" font-size="20" fill="#1E293B" font-weight="bold" text-anchor="start">Esofagitis grado B–D</text><text x="60" y="630" font-family="Arial" font-size="13" fill="#64748B" font-weight="bold" text-anchor="start">Confianza de la IA</text><rect x="60" y="642" width="340" height="16" rx="8" fill="#E2E8F0"/><rect x="60" y="642" width="296" height="16" rx="8" fill="#1F3A5F"/><text x="420" y="656" font-family="Arial" font-size="15" fill="#1E293B" font-weight="bold" text-anchor="start">87 %</text><rect x="60" y="690" width="18" height="18" rx="3" fill="#fff" stroke="#64748B" stroke-width="1.5"/><text x="88" y="705" font-family="Arial" font-size="14" fill="#1E293B" text-anchor="start">Mostrar mapa de calor (Grad-CAM)</text><text x="60" y="760" font-family="Arial" font-size="14" fill="#64748B" text-anchor="start">Tu decisión inicial: Esofagitis grado B–D · confianza 3</text><text x="60" y="820" font-family="Arial" font-size="13" fill="#B42318" font-weight="bold" text-anchor="start">La IA puede equivocarse. Analiza antes de aceptar.</text><rect x="520" y="140" width="470" height="720" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="540" y="174" font-family="Arial" font-size="18" fill="#1E293B" font-weight="bold" text-anchor="start">Tutor de IA</text><rect x="610" y="190" width="360" height="64" rx="12" fill="#E8EEF6"/><text x="624" y="216" font-family="Arial" font-size="14" fill="#1E293B" text-anchor="start">¿Qué hallazgos debo buscar para</text><text x="624" y="238" font-family="Arial" font-size="14" fill="#1E293B" text-anchor="start">diferenciar esofagitis de Barrett?</text><rect x="540" y="270" width="360" height="64" rx="12" fill="#F1F5F9"/><text x="554" y="296" font-family="Arial" font-size="14" fill="#1E293B" text-anchor="start">Observa el color de la mucosa sobre la</text><text x="554" y="318" font-family="Arial" font-size="14" fill="#1E293B" text-anchor="start">línea Z y si hay erosiones longitudinales.</text><rect x="610" y="350" width="360" height="64" rx="12" fill="#E8EEF6"/><text x="624" y="376" font-family="Arial" font-size="14" fill="#1E293B" text-anchor="start">¿La ROI de la IA coincide con lo</text><text x="624" y="398" font-family="Arial" font-size="14" fill="#1E293B" text-anchor="start">que ves en la imagen?</text><rect x="540" y="430" width="360" height="64" rx="12" fill="#F1F5F9"/><text x="554" y="456" font-family="Arial" font-size="14" fill="#1E293B" text-anchor="start">Compárala con la zona de mayor daño.</text><text x="554" y="478" font-family="Arial" font-size="14" fill="#1E293B" text-anchor="start">La decisión final es tuya.</text><text x="540" y="540" font-family="Arial" font-size="12" fill="#64748B" font-style="italic" text-anchor="start">El tutor orienta; no revela la respuesta (RF-07.2)</text><text x="540" y="772" font-family="Arial" font-size="13" fill="#64748B" font-weight="bold" text-anchor="start"></text><rect x="540" y="780" width="330" height="42" rx="6" fill="#fff" stroke="#94A3B8" stroke-width="1.5"/><text x="552" y="806.0" font-family="Arial" font-size="14" fill="#94A3B8" text-anchor="start">Escribe tu pregunta…</text><rect x="880" y="780" width="90" height="42" rx="8" fill="#1F3A5F"/><text x="925.0" y="806.0" font-family="Arial" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">Enviar</text><rect x="1010" y="140" width="390" height="720" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="1030" y="174" font-family="Arial" font-size="18" fill="#1E293B" font-weight="bold" text-anchor="start">Decisión final</text><circle cx="1039" cy="205" r="9" fill="#fff" stroke="#64748B" stroke-width="1.5"/><text x="1056" y="210" font-family="Arial" font-size="15" fill="#1E293B" text-anchor="start">Normal: línea Z</text><circle cx="1039" cy="249" r="9" fill="#fff" stroke="#64748B" stroke-width="1.5"/><text x="1056" y="254" font-family="Arial" font-size="15" fill="#1E293B" text-anchor="start">Normal: píloro</text><circle cx="1039" cy="293" r="9" fill="#fff" stroke="#64748B" stroke-width="1.5"/><text x="1056" y="298" font-family="Arial" font-size="15" fill="#1E293B" text-anchor="start">Normal: estómago (retroflexión)</text><circle cx="1039" cy="337" r="9" fill="#fff" stroke="#64748B" stroke-width="1.5"/><circle cx="1039" cy="337" r="5" fill="#1F3A5F"/><text x="1056" y="342" font-family="Arial" font-size="15" fill="#1E293B" text-anchor="start">Esofagitis grado A</text><circle cx="1039" cy="381" r="9" fill="#fff" stroke="#64748B" stroke-width="1.5"/><text x="1056" y="386" font-family="Arial" font-size="15" fill="#1E293B" text-anchor="start">Esofagitis grado B–D</text><circle cx="1039" cy="425" r="9" fill="#fff" stroke="#64748B" stroke-width="1.5"/><text x="1056" y="430" font-family="Arial" font-size="15" fill="#1E293B" text-anchor="start">Esófago de Barrett</text><circle cx="1039" cy="469" r="9" fill="#fff" stroke="#64748B" stroke-width="1.5"/><text x="1056" y="474" font-family="Arial" font-size="15" fill="#1E293B" text-anchor="start">Barrett de segmento corto</text><text x="1030" y="540" font-family="Arial" font-size="13" fill="#64748B" font-weight="bold" text-anchor="start">Nivel de confianza</text><rect x="1030" y="550" width="44" height="38" rx="6" fill="#fff" stroke="#94A3B8" stroke-width="1.5"/><text x="1052" y="575" font-family="Arial" font-size="15" fill="#1E293B" font-weight="bold" text-anchor="middle">1</text><rect x="1082" y="550" width="44" height="38" rx="6" fill="#fff" stroke="#94A3B8" stroke-width="1.5"/><text x="1104" y="575" font-family="Arial" font-size="15" fill="#1E293B" font-weight="bold" text-anchor="middle">2</text><rect x="1134" y="550" width="44" height="38" rx="6" fill="#fff" stroke="#94A3B8" stroke-width="1.5"/><text x="1156" y="575" font-family="Arial" font-size="15" fill="#1E293B" font-weight="bold" text-anchor="middle">3</text><rect x="1186" y="550" width="44" height="38" rx="6" fill="#1F3A5F" stroke="#94A3B8" stroke-width="1.5"/><text x="1208" y="575" font-family="Arial" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">4</text><rect x="1238" y="550" width="44" height="38" rx="6" fill="#fff" stroke="#94A3B8" stroke-width="1.5"/><text x="1260" y="575" font-family="Arial" font-size="15" fill="#1E293B" font-weight="bold" text-anchor="middle">5</text><text x="1030" y="608" font-family="Arial" font-size="12" fill="#64748B" text-anchor="start">1 = nada seguro · 5 = muy seguro</text><rect x="1030" y="660" width="350" height="44" rx="8" fill="#008A3E"/><text x="1205.0" y="687.0" font-family="Arial" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">Confirmar decisión final</text><rect x="1030" y="730" width="350" height="34" rx="6" fill="#FFF8E5" stroke="#C9A227" stroke-width="1.5"/><text x="1042" y="752" font-family="Arial" font-size="13" fill="#7A5A00" text-anchor="start">No podrás cambiarla después</text><rect x="536" y="345" width="440" height="220" rx="0" fill="#fff"/><rect x="540" y="360" width="430" height="130" rx="10" fill="#FFF8E5" stroke="#C9A227" stroke-width="1.5"/><text x="560" y="392" font-family="Arial" font-size="15" fill="#7A5A00" font-weight="bold" text-anchor="start">⚠ El tutor no está disponible en este momento</text><text x="560" y="420" font-family="Arial" font-size="14" fill="#7A5A00" text-anchor="start">No recibimos respuesta en 15 segundos.</text><text x="560" y="444" font-family="Arial" font-size="14" fill="#7A5A00" text-anchor="start">Puedes continuar el caso y tomar tu decisión final</text><text x="560" y="468" font-family="Arial" font-size="14" fill="#7A5A00" text-anchor="start">con la información que ya tienes.</text><rect x="540" y="505" width="200" height="38" rx="8" fill="#fff" stroke="#1F3A5F" stroke-width="1.5"/><text x="640.0" y="529.0" font-family="Arial" font-size="15" fill="#1F3A5F" font-weight="bold" text-anchor="middle">Reintentar</text></svg>