<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><title>W05 Ingreso con código de recuperación</title><rect x="0" y="0" width="1440" height="900" rx="0" fill="#F4F6FA"/><rect x="0" y="0" width="1440" height="64" rx="0" fill="#1F3A5F"/><text x="28" y="40" font-family="Arial" font-size="22" fill="#fff" font-weight="bold" text-anchor="start">GASTRO-SIM</text><rect x="450" y="150" width="540" height="560" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><circle cx="720" cy="230" r="34" fill="#E8EEF6"/><text x="720" y="242" font-family="Arial" font-size="30" fill="#1E293B" text-anchor="middle">🔑</text><text x="720" y="310" font-family="Arial" font-size="26" fill="#1E293B" font-weight="bold" text-anchor="middle">Usar un código de recuperación</text><text x="720" y="342" font-family="Arial" font-size="14" fill="#64748B" text-anchor="middle">Escribe uno de los 10 códigos que guardaste al activar el 2FA</text><text x="490" y="392" font-family="Arial" font-size="13" fill="#64748B" font-weight="bold" text-anchor="start">Código de recuperación</text><rect x="490" y="400" width="460" height="52" rx="6" fill="#fff" stroke="#94A3B8" stroke-width="1.5"/><text x="502" y="431.0" font-family="Arial" font-size="14" fill="#94A3B8" text-anchor="start">XXXX-XXXX</text><rect x="490" y="490" width="460" height="44" rx="8" fill="#1F3A5F"/><text x="720.0" y="517.0" font-family="Arial" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">Ingresar</text><text x="720" y="570" font-family="Arial" font-size="15" fill="#1F3A5F" font-weight="bold" text-anchor="middle">← Volver al código de la aplicación</text><rect x="490" y="610" width="460" height="34" rx="6" fill="#FFF8E5" stroke="#C9A227" stroke-width="1.5"/><text x="502" y="632" font-family="Arial" font-size="13" fill="#7A5A00" text-anchor="start">Cada código funciona una sola vez (RF-01.6)</text><text x="720" y="680" font-family="Arial" font-size="12" fill="#64748B" text-anchor="middle">¿Perdiste también tus códigos? Pide al administrador restablecer tu 2FA.</text></svg>