<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><title>W03 Activación de 2FA y aviso académico</title><rect x="0" y="0" width="1440" height="900" rx="0" fill="#F4F6FA"/><rect x="0" y="0" width="1440" height="64" rx="0" fill="#1F3A5F"/><text x="28" y="40" font-family="Arial" font-size="22" fill="#fff" font-weight="bold" text-anchor="start">GASTRO-SIM · Primer ingreso</text><rect x="40" y="100" width="660" height="760" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="60" y="134" font-family="Arial" font-size="18" fill="#1E293B" font-weight="bold" text-anchor="start">1. Activa la verificación en dos pasos</text><text x="60" y="170" font-family="Arial" font-size="14" fill="#64748B" text-anchor="start">Escanea este código con Google Authenticator, Microsoft Authenticator o Authy.</text><rect x="60" y="200" width="220" height="220" rx="4" fill="#fff" stroke="#1E293B" stroke-width="1.5"/><rect x="72" y="212" width="24" height="24" rx="0" fill="#1E293B"/><rect x="72" y="324" width="24" height="24" rx="0" fill="#1E293B"/><rect x="72" y="380" width="24" height="24" rx="0" fill="#1E293B"/><rect x="100" y="240" width="24" height="24" rx="0" fill="#1E293B"/><rect x="100" y="352" width="24" height="24" rx="0" fill="#1E293B"/><rect x="128" y="268" width="24" height="24" rx="0" fill="#1E293B"/><rect x="128" y="380" width="24" height="24" rx="0" fill="#1E293B"/><rect x="156" y="296" width="24" height="24" rx="0" fill="#1E293B"/><rect x="184" y="212" width="24" height="24" rx="0" fill="#1E293B"/><rect x="184" y="324" width="24" height="24" rx="0" fill="#1E293B"/><rect x="212" y="240" width="24" height="24" rx="0" fill="#1E293B"/><rect x="212" y="352" width="24" height="24" rx="0" fill="#1E293B"/><rect x="240" y="212" width="24" height="24" rx="0" fill="#1E293B"/><rect x="240" y="268" width="24" height="24" rx="0" fill="#1E293B"/><rect x="240" y="380" width="24" height="24" rx="0" fill="#1E293B"/><text x="310" y="232" font-family="Arial" font-size="13" fill="#64748B" font-weight="bold" text-anchor="start">Código de la aplicación</text><rect x="310" y="240" width="360" height="42" rx="6" fill="#fff" stroke="#94A3B8" stroke-width="1.5"/><text x="322" y="266.0" font-family="Arial" font-size="14" fill="#94A3B8" text-anchor="start">000 000</text><rect x="310" y="300" width="200" height="44" rx="8" fill="#fff" stroke="#1F3A5F" stroke-width="1.5"/><text x="410.0" y="327.0" font-family="Arial" font-size="15" fill="#1F3A5F" font-weight="bold" text-anchor="middle">Confirmar</text><text x="60" y="470" font-family="Arial" font-size="18" fill="#1E293B" font-weight="bold" text-anchor="start">2. Guarda tus 10 códigos de recuperación</text><text x="60" y="498" font-family="Arial" font-size="14" fill="#64748B" text-anchor="start">Cada código sirve una sola vez si pierdes tu teléfono.</text><rect x="60" y="520" width="280" height="40" rx="6" fill="#E8EEF6"/><text x="200" y="546" font-family="Arial" font-size="16" fill="#1F3A5F" font-weight="bold" text-anchor="middle">XXXX-XXXX</text><rect x="360" y="520" width="280" height="40" rx="6" fill="#E8EEF6"/><text x="500" y="546" font-family="Arial" font-size="16" fill="#1F3A5F" font-weight="bold" text-anchor="middle">XXXX-XXXX</text><rect x="60" y="572" width="280" height="40" rx="6" fill="#E8EEF6"/><text x="200" y="598" font-family="Arial" font-size="16" fill="#1F3A5F" font-weight="bold" text-anchor="middle">XXXX-XXXX</text><rect x="360" y="572" width="280" height="40" rx="6" fill="#E8EEF6"/><text x="500" y="598" font-family="Arial" font-size="16" fill="#1F3A5F" font-weight="bold" text-anchor="middle">XXXX-XXXX</text><rect x="60" y="624" width="280" height="40" rx="6" fill="#E8EEF6"/><text x="200" y="650" font-family="Arial" font-size="16" fill="#1F3A5F" font-weight="bold" text-anchor="middle">XXXX-XXXX</text><rect x="360" y="624" width="280" height="40" rx="6" fill="#E8EEF6"/><text x="500" y="650" font-family="Arial" font-size="16" fill="#1F3A5F" font-weight="bold" text-anchor="middle">XXXX-XXXX</text><rect x="60" y="676" width="280" height="40" rx="6" fill="#E8EEF6"/><text x="200" y="702" font-family="Arial" font-size="16" fill="#1F3A5F" font-weight="bold" text-anchor="middle">XXXX-XXXX</text><rect x="360" y="676" width="280" height="40" rx="6" fill="#E8EEF6"/><text x="500" y="702" font-family="Arial" font-size="16" fill="#1F3A5F" font-weight="bold" text-anchor="middle">XXXX-XXXX</text><rect x="60" y="728" width="280" height="40" rx="6" fill="#E8EEF6"/><text x="200" y="754" font-family="Arial" font-size="16" fill="#1F3A5F" font-weight="bold" text-anchor="middle">XXXX-XXXX</text><rect x="360" y="728" width="280" height="40" rx="6" fill="#E8EEF6"/><text x="500" y="754" font-family="Arial" font-size="16" fill="#1F3A5F" font-weight="bold" text-anchor="middle">XXXX-XXXX</text><rect x="60" y="790" width="280" height="44" rx="8" fill="#fff" stroke="#1F3A5F" stroke-width="1.5"/><text x="200.0" y="817.0" font-family="Arial" font-size="15" fill="#1F3A5F" font-weight="bold" text-anchor="middle">Descargar códigos (.txt)</text><rect x="360" y="790" width="280" height="44" rx="8" fill="#fff" stroke="#1F3A5F" stroke-width="1.5"/><text x="500.0" y="817.0" font-family="Arial" font-size="15" fill="#1F3A5F" font-weight="bold" text-anchor="middle">Copiar</text><rect x="740" y="100" width="660" height="760" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="760" y="134" font-family="Arial" font-size="18" fill="#1E293B" font-weight="bold" text-anchor="start">2. Aviso de uso académico</text><rect x="760" y="150" width="620" height="420" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><rect x="780" y="175" width="580" height="9" rx="4" fill="#E2E8F0"/><rect x="780" y="201" width="580" height="9" rx="4" fill="#E2E8F0"/><rect x="780" y="227" width="580" height="9" rx="4" fill="#E2E8F0"/><rect x="780" y="253" width="580" height="9" rx="4" fill="#E2E8F0"/><rect x="780" y="279" width="580" height="9" rx="4" fill="#E2E8F0"/><rect x="780" y="305" width="580" height="9" rx="4" fill="#E2E8F0"/><rect x="780" y="331" width="580" height="9" rx="4" fill="#E2E8F0"/><rect x="780" y="357" width="580" height="9" rx="4" fill="#E2E8F0"/><rect x="780" y="383" width="580" height="9" rx="4" fill="#E2E8F0"/><rect x="780" y="409" width="580" height="9" rx="4" fill="#E2E8F0"/><rect x="780" y="435" width="580" height="9" rx="4" fill="#E2E8F0"/><rect x="780" y="461" width="580" height="9" rx="4" fill="#E2E8F0"/><rect x="780" y="487" width="580" height="9" rx="4" fill="#E2E8F0"/><rect x="780" y="513" width="580" height="9" rx="4" fill="#E2E8F0"/><rect x="780" y="539" width="348.0" height="9" rx="4" fill="#E2E8F0"/><rect x="760" y="605" width="18" height="18" rx="3" fill="#1F3A5F" stroke="#64748B" stroke-width="1.5"/><path d="M764 614 l4 4 l7 -9" stroke="#fff" stroke-width="2.5" fill="none"/><text x="788" y="620" font-family="Arial" font-size="14" fill="#1E293B" text-anchor="start">Entiendo que GASTRO-SIM es una herramienta académica y no diagnóstica.</text><rect x="760" y="645" width="18" height="18" rx="3" fill="#1F3A5F" stroke="#64748B" stroke-width="1.5"/><path d="M764 654 l4 4 l7 -9" stroke="#fff" stroke-width="2.5" fill="none"/><text x="788" y="660" font-family="Arial" font-size="14" fill="#1E293B" text-anchor="start">Autorizo el tratamiento de mis datos según la Ley 1581 de 2012.</text><text x="760" y="710" font-family="Arial" font-size="13" fill="#64748B" text-anchor="start">Sin aceptar ambos puntos no se puede acceder a los casos. Se guardan la fecha y la hora.</text><rect x="760" y="780" width="620" height="44" rx="8" fill="#1F3A5F"/><text x="1070.0" y="807.0" font-family="Arial" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">Aceptar y continuar</text></svg>