s de rol: Estudiante · Docente</text><rect x="0" y="0" width="1440" height="900" fill="#0F172A" fill-opacity="0.55"/><rect x="420" y="200" width="600" height="470" rx="14" fill="#fff"/><text x="452" y="252" font-family="Arial" font-size="22" fill="#1E293B" font-weight="bold" text-anchor="start">Restablecer la verificación en dos pasos</text><text x="988" y="250" font-family="Arial" font-size="20" fill="#64748B" text-anchor="end">✕</text><text x="452" y="290" font-family="Arial" font-size="16" fill="#1E293B" font-weight="bold" text-anchor="start">Cuenta: andres.ruiz@usc.edu.co</text><text x="452" y="330" font-family="Arial" font-size="15" fill="#1E293B" text-anchor="start">Se eliminarán su aplicación autenticadora y sus códigos</text><text x="452" y="354" font-family="Arial" font-size="15" fill="#1E293B" text-anchor="start">de recuperación. En su próximo ingreso deberá activar</text><text x="452" y="378" font-family="Arial" font-size="15" fill="#1E293B" text-anchor="start">de nuevo el 2FA.</text><rect x="452" y="410" width="536" height="70" rx="8" fill="#F1F5F9"/><text x="468" y="440" font-family="Arial" font-size="14" fill="#64748B" text-anchor="start">Quedará registrado: quién lo hizo, cuándo</text><text x="468" y="464" font-family="Arial" font-size="14" fill="#64748B" text-anchor="start">y a qué cuenta.</text><rect x="452" y="580" width="250" height="44" rx="8" fill="#fff" stroke="#1F3A5F" stroke-width="1.5"/><text x="577.0" y="607.0" font-family="Arial" font-size="15" fill="#1F3A5F" font-weight="bold" text-anchor="middle">Cancelar</text><rect x="738" y="580" width="250" height="44" rx="8" fill="#fff" stroke="#B42318" stroke-width="1.5"/><text x="863.0" y="607.0" font-family="Arial" font-size="15" fill="#B42318" font-weight="bold" text-anchor="middle">Restablecer</text></svg>