<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><title>W19 Docente – configuración de errores y exportación</title><rect x="0" y="0" width="1440" height="900" rx="0" fill="#F4F6FA"/><rect x="0" y="0" width="1440" height="64" rx="0" fill="#1F3A5F"/><text x="28" y="40" font-family="Arial" font-size="22" fill="#fff" font-weight="bold" text-anchor="start">GASTRO-SIM</text><text x="230" y="39" font-family="Arial" font-size="15" fill="#fff" text-anchor="start">Revisión de casos</text><text x="410.5" y="39" font-family="Arial" font-size="15" fill="#fff" font-weight="bold" text-anchor="start">Configuración y exportación</text><rect x="410.5" y="54" width="221.39999999999998" height="4" rx="2" fill="#7FB3E6"/><rect x="970" y="18" width="250" height="28" rx="14" fill="#FFF4D6"/><text x="1095" y="37" font-family="Arial" font-size="13" fill="#7A5A00" font-weight="bold" text-anchor="middle">⚠ Uso académico · no diagnóstico</text><circle cx="1260" cy="32" r="16" fill="#7FB3E6"/><text x="1285" y="37" font-family="Arial" font-size="14" fill="#fff" text-anchor="start">Docente ▾</text><text x="40" y="118" font-family="Arial" font-size="28" fill="#1E293B" font-weight="bold" text-anchor="start">Configuración y exportación</text><rect x="40" y="150" width="660" height="500" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="60" y="184" font-family="Arial" font-size="18" fill="#1E293B" font-weight="bold" text-anchor="start">Inyección de errores de la IA</text><text x="60" y="220" font-family="Arial" font-size="14" fill="#64748B" font-weight="bold" text-anchor="start">Porcentaje de intentos con recomendación alterada</text><rect x="60" y="250" width="520" height="8" rx="4" fill="#E2E8F0"/><rect x="60" y="250" width="208" height="8" rx="4" fill="#1F3A5F"/><circle cx="268" cy="254" r="14" fill="#fff" stroke="#1F3A5F" stroke-width="3"/><text x="600" y="262" font-family="Arial" font-size="20" fill="#1F3A5F" font-weight="bold" text-anchor="start">20 %</text><text x="60" y="285" font-family="Arial" font-size="12" fill="#64748B" text-anchor="start">0 %</text><text x="580" y="285" font-family="Arial" font-size="12" fill="#64748B" text-anchor="end">50 %</text><text x="60" y="340" font-family="Arial" font-size="14" fill="#64748B" font-weight="bold" text-anchor="start">Tipos de alteración</text><rect x="60" y="365" width="18" height="18" rx="3" fill="#1F3A5F" stroke="#64748B" stroke-width="1.5"/><path d="M64 374 l4 4 l7 -9" stroke="#fff" stroke-width="2.5" fill="none"/><text x="88" y="380" font-family="Arial" font-size="15" fill="#1E293B" text-anchor="start">Clase incorrecta</text><rect x="60" y="405" width="18" height="18" rx="3" fill="#1F3A5F" stroke="#64748B" stroke-width="1.5"/><path d="M64 414 l4 4 l7 -9" stroke="#fff" stroke-width="2.5" fill="none"/><text x="88" y="420" font-family="Arial" font-size="15" fill="#1E293B" text-anchor="start">Confianza alterada</text><rect x="60" y="445" width="18" height="18" rx="3" fill="#fff" stroke="#64748B" stroke-width="1.5"/><text x="88" y="460" font-family="Arial" font-size="15" fill="#1E293B" text-anchor="start">Región de interés desplazada</text><rect x="60" y="500" width="620" height="34" rx="6" fill="#FFF8E5" stroke="#C9A227" stroke-width="1.5"/><text x="72" y="522" font-family="Arial" font-size="13" fill="#7A5A00" text-anchor="start">El estudiante solo sabe si hubo alteración en la retroalimentación</text><rect x="480" y="580" width="200" height="44" rx="8" fill="#1F3A5F"/><text x="580.0" y="607.0" font-family="Arial" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">Guardar</text><rect x="720" y="150" width="680" height="500" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="740" y="184" font-family="Arial" font-size="18" fill="#1E293B" font-weight="bold" text-anchor="start">Exportar datos de los intentos</text><text x="740" y="220" font-family="Arial" font-size="15" fill="#1E293B" text-anchor="start">Descarga un archivo CSV con todos los intentos registrados.</text><text x="740" y="260" font-family="Arial" font-size="14" fill="#64748B" text-anchor="start">Columnas: participante (seudónimo), caso, dificultad, referencia,</text><text x="740" y="284" font-family="Arial" font-size="14" fill="#64748B" text-anchor="start">alteración, decisiones y confianza, aciertos, puntaje y tiempos.</text><rect x="740" y="320" width="640" height="70" rx="8" fill="#EAF6EE"/><text x="760" y="352" font-family="Arial" font-size="15" fill="#008A3E" font-weight="bold" text-anchor="start">🔒 Datos seudonimizados</text><text x="760" y="376" font-family="Arial" font-size="13" fill="#008A3E" text-anchor="start">El archivo no incluye nombres ni correos electrónicos.</text><rect x="740" y="420" width="300" height="44" rx="8" fill="#1F3A5F"/><text x="890.0" y="447.0" font-family="Arial" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">⬇ Descargar CSV</text></svg>